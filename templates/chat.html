<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SkillForge AI - Chat</title>
  </head>
  <body>
    <h1>SkillForge AI - Chat</h1>
    <a href="/chat-history">View Chat History</a>

    <div id="chat-box">
      {% for c in chats %}
        <div style="margin-bottom:10px;">
          <strong>You:</strong> {{ c['message'] }}<br>
          <strong>AI:</strong> {{ c['response'] }}<br>
          <small>{{ c['created_at'] }}</small>
        </div>
      {% else %}
        <div>No messages yet.</div>
      {% endfor %}
    </div>

    <form id="chat-form">
      <input type="hidden" id="user_id" value="{{ user_id }}">
      <input id="message" placeholder="Type your message" style="width:60%" />
      <button type="submit">Send</button>
    </form>

    <script>
      const form = document.getElementById('chat-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const user_id = document.getElementById('user_id').value;
        const message = document.getElementById('message').value;
        if (!message) return;
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({user_id, message})
        });
        const data = await res.json();
        // append to chat box
        const div = document.createElement('div');
        div.innerHTML = `<strong>You:</strong> ${message}<br><strong>AI:</strong> ${data.response}<br><small>just now</small>`;
        document.getElementById('chat-box').prepend(div);
        document.getElementById('message').value = '';
      });
    </script>
  </body>
</html>
